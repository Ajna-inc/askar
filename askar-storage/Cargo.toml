[package]
name = "askar-storage"
version = "0.2.4"
authors = ["Hyperledger Aries Contributors <aries@lists.hyperledger.org>"]
edition = "2021"
description = "Askar secure storage support"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/openwallet-foundation/askar/"
categories = ["cryptography", "database"]
keywords = ["encryption", "signatures", "ssi", "verifiable", "credentials"]
rust-version = "1.81"

[package.metadata.docs.rs]
features = ["all_backends"]
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
all_backends = ["any", "postgres", "sqlite"]
any = []
default = ["all_backends", "log"]
flatfile = ["dep:rand"]
migration = ["dep:rmp-serde", "dep:sqlx", "sqlx?/macros"]
pg_test = ["postgres"]
postgres = ["dep:sqlx", "sqlx?/postgres", "sqlx?/tls-rustls"]
sqlite = ["dep:sqlx", "sqlx?/sqlite"]

[dependencies]
arc-swap = "1.6"
async-lock = "3.4"
async-stream = "0.3"
bs58 = "0.5"
chrono = "0.4"
ciborium = "0.2"
digest = "0.10"
futures-lite = "2.6"
hex = "0.4"
hmac = "0.12"
itertools = "0.14"
log = { version = "0.4", optional = true }
once_cell = "1.21"
percent-encoding = "2.3"
rand = { version = "0.8", optional = true }
rmp-serde = { version = "1.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["rt-multi-thread", "sync", "time"] }
url = { version = "2.5", default-features = false }
uuid = { version = "1.18", features = ["v4", "serde"] }
zeroize = "1.5"

[dependencies.askar-crypto]
default-features = false
features = ["alloc", "argon2", "chacha", "std_rng"]
path = "../askar-crypto"
version = "0.3"

[dependencies.sqlx]
default-features = false
features = ["chrono", "runtime-tokio"]
optional = true
version = "0.8.6"

[dev-dependencies]
env_logger = "0.10"
hex-literal = "0.4"
rand = { version = "0.8" }
tempfile = "3.8"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[[test]]
name = "backends"

[[test]]
name = "sqlite_connect_under_write"
required-features = ["sqlite"]

[[example]]
name = "freshness_fixture"
required-features = ["sqlite", "postgres"]
